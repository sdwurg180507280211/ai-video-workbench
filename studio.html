<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 视频工作台</title>
<style>
:root {
  --bg: #f3f4f7; --card: #ffffff; --ink: #1b2130; --muted: #6a7283; --line: #e3e6ec;
  --accent: #4357d8; --accent-soft: #eceffd;
  --doing: #2d63d6; --doing-bg: #e6eeff;
  --paused: #9a6a00; --paused-bg: #fdf1d6;
  --done: #1d7a4b; --done-bg: #e0f3e8;
  --shadow: 0 1px 2px rgba(20, 28, 45, .06), 0 6px 18px rgba(20, 28, 45, .06);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --card: #1b2029; --ink: #e7eaf0; --muted: #98a1b1; --line: #2a303c;
    --accent: #8c9bff; --accent-soft: #252b44;
    --doing: #8fb0ff; --doing-bg: #1f2a44;
    --paused: #f0c35c; --paused-bg: #3a2f17;
    --done: #78d3a1; --done-bg: #17342a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 28px 0 8px; }
.brand { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
.day { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line);
  padding: 4px 12px; border-radius: 999px; white-space: nowrap; }

/* 首页 */
.group { margin-top: 28px; }
.group h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 12px; display: flex; gap: 8px; align-items: baseline; }
.group h2 b { font-size: 20px; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 16px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card h3 { margin: 0; font-size: 20px; line-height: 1.3; }
.faces { display: flex; gap: 8px; flex-wrap: wrap; min-height: 72px; }
.face { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; background: var(--accent-soft);
  border: 1px solid var(--line); display: block; }
.face.none { display: grid; place-items: center; font-size: 22px; font-weight: 700; color: var(--accent); }
.empty-faces { font-size: 14px; color: var(--muted); align-self: center; }
.chip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.s-进行中 { color: var(--doing); background: var(--doing-bg); }
.s-暂停 { color: var(--paused); background: var(--paused-bg); }
.s-已完成 { color: var(--done); background: var(--done-bg); }
.none-yet { color: var(--muted); font-size: 15px; padding: 8px 0; }

/* 作品页 */
.back { display: inline-block; margin-top: 8px; font-size: 15px; color: var(--accent); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0 4px; }
.head h1 { margin: 0; font-size: 28px; line-height: 1.25; }
.kind { color: var(--muted); font-size: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; margin-top: 20px; }
.panel > h2 { margin: 0 0 14px; font-size: 16px; color: var(--muted); font-weight: 600; }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.cast figure { margin: 0; }
.cast button { all: unset; cursor: zoom-in; display: block; width: 100%; }
.cast img, .cast .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; display: block;
  background: var(--accent-soft); border: 1px solid var(--line); }
.cast .ph { display: grid; place-items: center; font-size: 40px; font-weight: 700; color: var(--accent); }
.cast figcaption { margin-top: 8px; font-weight: 600; text-align: center; }
.cast figcaption small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
video { width: 100%; max-height: 72vh; border-radius: 12px; background: #000; display: block; }

/* 剧本排版 */
.script { max-width: 760px; margin: 0 auto; }
.src { font-size: 12px; color: var(--muted); margin: -6px 0 18px; word-break: break-all; }
.script .h2 { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin: 28px 0 10px;
  padding-top: 14px; border-top: 1px solid var(--line); }
.script .src + .h2 { border-top: 0; padding-top: 0; margin-top: 0; }
.script .scene { font-weight: 700; margin: 26px 0 10px; padding: 6px 12px; background: var(--accent-soft);
  border-radius: 8px; display: inline-block; }
.script .act { color: var(--muted); margin: 10px 0; white-space: pre-line; }
.script .say { margin: 14px 0 14px 8%; }
.script .say .who { font-size: 14px; font-weight: 700; color: var(--accent); }
.script .say .what { font-size: 17px; white-space: pre-line; }
.script ul { margin: 8px 0; padding-left: 20px; }
.script li { margin: 8px 0; }
.script .note { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); margin: 10px 0; }
.script .line { color: var(--ink); font-weight: 600; }
.script .line::before { content: "“"; } .script .line::after { content: "”"; }
.script .sfx { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 0 2px; }
.tablebox { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; }
.tablebox table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
.tablebox th, .tablebox td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tablebox th { background: var(--accent-soft); font-weight: 600; white-space: nowrap; }
.tablebox tr:last-child td { border-bottom: 0; }
.msg { color: var(--muted); }

/* 看大图 */
#lightbox { position: fixed; inset: 0; background: rgba(8, 10, 16, .88); display: grid; place-items: center;
  padding: 16px; cursor: zoom-out; z-index: 10; }
#lightbox[hidden] { display: none; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }

@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .head h1 { font-size: 24px; }
  .script .say { margin-left: 0; }
  .panel { padding: 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="#">AI 视频工作台</a><span class="day" id="day" hidden></span></header>
  <main id="app"><p class="msg">加载中…</p></main>
</div>
<div id="lightbox" hidden><img alt=""></div>
<script>
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const url = (base, rel) => base + rel.split('/').map(encodeURIComponent).join('/');
const chip = s => `<span class="chip s-${esc(s)}">${esc(s)}</span>`;

// 剧本里的行内写法：**粗体**、{台词}、<音效>、[链接](地址)、`代码`
function inline(text) {
  return esc(text)
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\{([^{}]+)\}/g, '<span class="line">$1</span>')
    .replace(/&lt;([^&]{1,40})&gt;/g, '<span class="sfx">$1</span>');
}

function face(c, cls) {
  if (!c.照片) return `<span class="${cls} none" title="${esc(c.名字)}">${esc(c.名字.slice(0, 1))}</span>`;
  return `<img class="${cls}" src="${url('/t/', c.照片)}" alt="${esc(c.名字)}" title="${esc(c.名字)}"
    loading="lazy" style="object-position:${esc(c.位置)} 20%">`;
}

async function getJSON(path) {
  const r = await fetch(path);
  const d = await r.json();
  if (!r.ok) throw new Error(d.错误 || r.statusText);
  return d;
}

async function showHome() {
  const d = await getJSON('/api/home');
  const day = document.getElementById('day');
  day.hidden = !d.day;
  day.textContent = d.day ? `入行第 ${d.day} 天` : '';
  document.title = 'AI 视频工作台';
  $app.innerHTML = d.groups.map(g => `
    <section class="group">
      <h2><b>${esc(g.类别)}</b>${g.作品.length} 部</h2>
      ${g.作品.length ? `<div class="grid">${g.作品.map(w => `
        <a class="card" href="#w=${encodeURIComponent(w.id)}">
          <div class="faces">${w.角色.length ? w.角色.map(c => face(c, 'face')).join('') : '<span class="empty-faces">还没有角色照片</span>'}</div>
          <div class="row"><h3>${esc(w.标题)}</h3>${chip(w.状态)}</div>
        </a>`).join('')}</div>` : '<p class="none-yet">还没有作品</p>'}
    </section>`).join('');
}

function renderScript(s) {
  if (!s) return '<p class="msg">作品.json 里还没写剧本在哪。</p>';
  if (s.缺失) return `<p class="msg">找不到剧本文件：${esc(s.来源)}</p>`;
  const body = s.blocks.map(b => {
    switch (b.t) {
      case 'h2': return `<div class="h2">${inline(b.text)}</div>`;
      case 'h': return `<div><span class="scene">${inline(b.text)}</span></div>`;
      case 'say': return `<div class="say"><div class="who">${esc(b.who)}</div><div class="what">${inline(b.text)}</div></div>`;
      case 'list': return `<ul>${b.items.map(i => `<li>${inline(i)}</li>`).join('')}</ul>`;
      case 'note': return `<div class="note">${inline(b.text)}</div>`;
      case 'table': return `<div class="tablebox"><table><thead><tr>${b.head.map(h => `<th>${inline(h)}</th>`).join('')}</tr></thead>
        <tbody>${b.rows.map(r => `<tr>${b.head.map((_, i) => `<td>${inline(r[i] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      default: return `<p class="act">${inline(b.text)}</p>`;
    }
  }).join('');
  return `<div class="src">${esc(s.来源)}</div>${body || '<p class="msg">剧本是空的。</p>'}`;
}

async function showWork(id) {
  const w = await getJSON('/api/work?id=' + encodeURIComponent(id));
  document.title = `${w.标题} · AI 视频工作台`;
  $app.innerHTML = `
    <a class="back" href="#">← 全部作品</a>
    <div class="head"><h1>${esc(w.标题)}</h1>${chip(w.状态)}<span class="kind">${esc(w.类别)}</span></div>
    <section class="panel"><h2>角色</h2>
      ${w.角色.length ? `<div class="cast">${w.角色.map(c => `<figure>
        ${c.照片 ? `<button data-full="${esc(url('/f/', c.照片))}" aria-label="看 ${esc(c.名字)} 的大图">${face(c, '')}</button>` : face(c, 'ph')}
        <figcaption>${esc(c.名字)}${c.照片 ? '' : '<small>没有照片</small>'}</figcaption></figure>`).join('')}</div>`
        : '<p class="msg">还没有角色照片。</p>'}
    </section>
    ${w.成片 ? `<section class="panel"><h2>成片</h2><video controls preload="metadata" src="${esc(url('/f/', w.成片))}"></video></section>` : ''}
    <section class="panel"><h2>剧本</h2><div class="script">${renderScript(w.剧本)}</div></section>`;
}

async function router() {
  const m = location.hash.match(/^#w=(.+)$/);
  try {
    if (m) await showWork(decodeURIComponent(m[1])); else await showHome();
  } catch (e) {
    $app.innerHTML = `<a class="back" href="#">← 全部作品</a><p class="msg">打不开：${esc(e.message)}</p>`;
  }
  window.scrollTo(0, 0);
}

const box = document.getElementById('lightbox');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-full]');
  if (b) { box.querySelector('img').src = b.dataset.full; box.hidden = false; }
});
box.addEventListener('click', () => { box.hidden = true; box.querySelector('img').src = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden) box.click(); });
window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
