<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 为什么会一本正经地胡说八道</title>
<style>
  @font-face { font-family: NS; src: url(/assets/fonts/NotoSansSC-VF.ttf); font-weight: 100 900; }
  @font-face { font-family: IN; src: url(/assets/fonts/Inter-VF.ttf); font-weight: 100 900; }
  @font-face { font-family: JB; src: url(/assets/fonts/JetBrainsMono-VF.ttf); font-weight: 100 800; }
  html, body { margin: 0; background: #E9EEF2; overflow: hidden; }
  svg { display: block; }
  text { font-family: IN, NS; font-kerning: normal; }
  .mono { font-family: JB, NS; }
</style>
</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="2.6" fill="#C8D2DB"/>
    </pattern>
    <!-- 贴纸：粗白描边 + 柔和投影 -->
    <filter id="stk" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="d"/>
      <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="w"/>
      <feGaussianBlur in="d" stdDeviation="9" result="b"/><feOffset in="b" dy="9" result="bo"/>
      <feFlood flood-color="#1d2b38" flood-opacity="0.20"/><feComposite in2="bo" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10" result="o"/>
      <feFlood flood-color="#1d2b38" flood-opacity="0.16"/><feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#1d2b38" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1d2b38" stop-opacity="0.13"/>
    </radialGradient>
  </defs>
  <g id="cam"><g id="world"></g></g>
  <g id="hud"></g>
  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const SLATE = '#263646', MID = '#5E6E7E', PALE = '#D6DFE7', LINE = '#B7C3CE', BG = '#E9EEF2';
const ACC = '#FF5A36', BLUE = '#3D6FE0', WHITE = '#FFFFFF', SOFT = '#F4F7FA', GREY = '#9FB0C0', GREY2 = '#C3CFDA';
const GREEN = '#22A06B', ACC_L = '#FFE3DA', BLUE_L = '#E3ECFB';

// ---------- 工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = {
  outCubic: x => 1 - (1 - x) ** 3,
  inCubic: x => x ** 3,
  inOutCubic: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
};
function rng(seed) {                 // 固定种子的随机数（mulberry32），每次渲染结果一样
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, o = {}) {
  const e = el('text', {
    x, y, 'font-size': o.size || 36, 'font-weight': o.weight || 500, fill: o.fill || SLATE,
    'text-anchor': o.anchor || 'start', 'letter-spacing': o.ls ?? 0,
  }, parent);
  if (o.mono) e.setAttribute('class', 'mono');
  if (o.opacity != null) e.setAttribute('opacity', o.opacity);
  e.textContent = s;
  return e;
}
const U = [];                      // 每帧要更新的函数
const on = f => U.push(f);
const tr = (g, x, y, s = 1, r = 0) => g.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${r.toFixed(3)}) scale(${s.toFixed(4)})`);
const op = (e, v) => e.setAttribute('opacity', clamp(v).toFixed(3));

function popper(g, x, y, t0, o = {}) {
  const dur = o.dur ?? .42, rot = o.rot ?? 0, from = o.from ?? .35;
  on(t => {
    const p = P(t, t0, t0 + dur);
    if (p <= 0) { g.setAttribute('opacity', 0); return; }
    let s = lerp(from, 1, ease.outBack(p, 2.0)), a = clamp(p * 3.5);
    const r = rot * (1 - ease.outCubic(p));
    if (o.out != null) { const q = P(t, o.out, o.out + (o.outDur ?? .3)); a *= 1 - q; s *= 1 - .15 * q; }
    g.setAttribute('opacity', a.toFixed(3));
    tr(g, x, y, s * (o.scale ?? 1), r);
  });
}
function rise(e, t0, o = {}) {
  const dur = o.dur ?? .45, dy = o.dy ?? 22;
  on(t => {
    const p = ease.outCubic(P(t, t0, t0 + dur));
    let a = p;
    if (o.out != null) a *= 1 - P(t, o.out, o.out + .3);
    e.setAttribute('opacity', a.toFixed(3));
    e.setAttribute('transform', `translate(0,${((1 - p) * dy).toFixed(2)})`);
  });
}
function rrect(parent, x, y, w, h, r, fill, extra = {}) {
  return el('rect', Object.assign({ x, y, width: w, height: h, rx: r, fill }, extra), parent);
}
function stampAt(s, x, y, t0, o = {}) {          // 印章砸下
  const g = el('g', { opacity: 0 }, o.parent || W);
  const r = el('g', { transform: `rotate(${o.rot ?? -9})` }, g), w = o.w || 210, size = o.size || 42, color = o.color || ACC;
  rrect(r, -w / 2, -size, w, size * 2, 14, 'rgba(255,255,255,.92)', { stroke: color, 'stroke-width': 7 });
  txt(r, 0, size * .36, s, { size, weight: 900, fill: color, anchor: 'middle', ls: 2 });
  on(t => { const p = P(t, t0, t0 + .2); op(g, p > 0 ? 1 - (o.out != null ? P(t, o.out, o.out + .3) : 0) : 0); tr(g, x, y, p > 0 ? lerp(1.8, 1, ease.outCubic(p)) : 0); });
  return g;
}
function appear(g, t0, o = {}) {                // 按绝对坐标画好的组：淡入并上移一点，不缩放
  on(t => {
    const p = ease.outCubic(P(t, t0, t0 + (o.dur ?? .4)));
    let a = p;
    if (o.out != null) a *= 1 - P(t, o.out, o.out + .3);
    g.setAttribute('opacity', a.toFixed(3));
    g.setAttribute('transform', `translate(0,${((1 - p) * (o.dy ?? 24)).toFixed(2)})`);
  });
}
const W = document.getElementById('world'), CAM = document.getElementById('cam'), HUD = document.getElementById('hud');
// 小团子贴纸：透明 PNG，按比例放进 size×size 的框（不拉伸）
function mascot(file, x, y, size, t0, o = {}) {
  const g = el('g', { opacity: 0 }, W);
  const body = el('g', {}, g);
  el('image', { href: `/assets/xiaotuanzi/${file}`, x: -size / 2, y: -size / 2, width: size, height: size, transform: o.flip ? 'scale(-1,1)' : '' }, body);
  popper(g, x, y, t0, { rot: o.rot ?? -8, from: .5, out: o.out });
  if (o.bob) on(t => body.setAttribute('transform', `translate(0,${(-Math.abs(Math.sin((t - t0) * 2.4)) * o.bob).toFixed(1)})`));
  return body;
}
function arrowHead(parent, color, size = 34) {
  return el('path', { d: `M0,0 L${-size},${-size * .62} L${-size},${size * .62} Z`, fill: color }, parent);
}
// 对勾、红叉：笔画沿路径画出来
function tick(parent, x, y, s, color, t0) {
  const p = el('path', { d: `M${x - .45 * s},${y + .02 * s} L${x - .12 * s},${y + .34 * s} L${x + .48 * s},${y - .36 * s}`, stroke: color, 'stroke-width': s * .17, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, opacity: 0 }, parent);
  if (t0 != null) on(t => { const q = ease.outCubic(P(t, t0, t0 + .25)); p.setAttribute('stroke-dasharray', `${q} 1`); op(p, q > 0 ? 1 : 0); });
  return p;
}
function cross(parent, x, y, s, color, t0) {
  const g = el('g', { opacity: 0 }, parent);
  const a = el('path', { d: `M${x - .4 * s},${y - .4 * s} L${x + .4 * s},${y + .4 * s}`, stroke: color, 'stroke-width': s * .17, 'stroke-linecap': 'round', pathLength: 1 }, g);
  const b = el('path', { d: `M${x + .4 * s},${y - .4 * s} L${x - .4 * s},${y + .4 * s}`, stroke: color, 'stroke-width': s * .17, 'stroke-linecap': 'round', pathLength: 1 }, g);
  if (t0 != null) on(t => {
    const q1 = ease.outCubic(P(t, t0, t0 + .14)), q2 = ease.outCubic(P(t, t0 + .1, t0 + .24));
    a.setAttribute('stroke-dasharray', `${q1} 1`); b.setAttribute('stroke-dasharray', `${q2} 1`); op(g, q1 > 0 ? 1 : 0);
  });
  return g;
}
// 气泡：文字量好宽度再画底；返回 {g, w}
function bubble(parent, x, y, s, o = {}) {
  const g = el('g', {}, parent), size = o.size || 36, h = o.h || size * 2.1;
  const bg = rrect(g, 0, y - h / 2, 0, h, o.r ?? h / 2.6, o.fill || SOFT, o.stroke ? { stroke: o.stroke, 'stroke-width': 4 } : {});
  const t = txt(g, 0, y + size * .36, s, { size, weight: o.weight || 700, fill: o.color || SLATE });
  const w = t.getComputedTextLength() + size * 1.3;
  const x0 = o.align === 'right' ? x - w : x;
  bg.setAttribute('x', x0); bg.setAttribute('width', w); t.setAttribute('x', x0 + size * .65);
  return { g, w, x0, t };
}
// 代码画的答题机器人：圆角方脑袋 + 屏幕脸 + 天线
function robot(parent, x, y, s = 1, mood = 'calm') {
  const g = el('g', { transform: `translate(${x},${y}) scale(${s})` }, parent);
  const b = el('g', { filter: 'url(#stk)' }, g);
  el('line', { x1: 0, y1: -86, x2: 0, y2: -118, stroke: SLATE, 'stroke-width': 8 }, b);
  el('circle', { cx: 0, cy: -124, r: 13, fill: mood === 'sly' ? ACC : BLUE }, b);
  rrect(b, -92, -88, 184, 150, 40, '#8FB0D6');
  rrect(b, -70, -64, 140, 98, 26, SLATE);
  if (mood === 'sly') {
    for (const sx of [-1, 1]) el('path', { d: `M${sx * 30 - 16},-18 Q${sx * 30},-34 ${sx * 30 + 16},-18`, stroke: '#7FE0FF', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, b);
    el('path', { d: 'M-22,6 Q0,24 22,6', stroke: '#7FE0FF', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, b);
  } else {
    for (const sx of [-1, 1]) el('circle', { cx: sx * 30, cy: -22, r: 12, fill: '#7FE0FF' }, b);
    el('path', { d: 'M-18,10 H18', stroke: '#7FE0FF', 'stroke-width': 8, 'stroke-linecap': 'round' }, b);
  }
  for (const sx of [-1, 1]) rrect(b, sx * 92 - (sx > 0 ? 0 : 16), -40, 16, 46, 8, '#6F97C8');
  return g;
}
// 放大镜
function magnifier(parent, s = 1) {
  const g = el('g', { transform: `scale(${s})` }, parent);
  el('circle', { cx: 0, cy: 0, r: 46, fill: 'rgba(255,255,255,.35)', stroke: SLATE, 'stroke-width': 13 }, g);
  el('path', { d: 'M33,33 L74,74', stroke: SLATE, 'stroke-width': 20, 'stroke-linecap': 'round' }, g);
  return g;
}
// 书页：几行灰线
function pageLines(parent, x, y, w, n, gap = 30, seed = 1) {
  const r = rng(seed), out = [];
  for (let i = 0; i < n; i++) {
    const lw = w * (i === n - 1 ? .55 : .82 + r() * .18);
    out.push({ x, y: y + i * gap, w: lw, e: rrect(parent, x, y + i * gap - 6, lw, 12, 6, GREY2) });
  }
  return out;
}

// ---------- 节拍 ----------
let C, EV;
const arrive = f => f[0] + (f[1] - f[0]) * .42;
const HOOK = [2000, 1200], C1 = [4200, 1200], C2 = [6400, 1200], C3 = [6400, 2600], C4 = [4200, 2600], C5 = [2000, 2600];
const CL = [2000, 4000], C6 = [4200, 4000], C7 = [6400, 4000];
const HC = [HOOK[0] - 470, HOOK[1]];                 // 聊天框中心
const PUSH = [CL[0] + 560, CL[1] + 20];             // 高潮推近：右边蒙的四格

function build() {
  el('rect', { x: -2000, y: -2000, width: 14000, height: 9000, fill: BG }, W);
  el('rect', { x: -2000, y: -2000, width: 14000, height: 9000, fill: 'url(#dots)' }, W);
  buildHook();
  buildTitle();
  buildTags();
  buildNext();
  buildRare();
  buildTone();
  buildExam();
  buildScore();
  buildClimax();
  buildGuard();
  buildOverview();
  buildEnding();
  buildHud();
  buildSubs();
}

// ===== 钩子：问生日，三次三个日期，都说得很肯定 =====
const ANS = ['3 月 7 日', '6 月 15 日', '1 月 1 日'];
function buildHook() {
  const ev = EV, [hx, hy] = HC;
  const X0 = hx - 350, Y0 = hy - 380, CW = 700, CH = 760;
  const card = el('g', { opacity: 0 }, W);
  rrect(card, X0, Y0, CW, CH, 34, WHITE, { filter: 'url(#shadow)' });
  rrect(card, X0, Y0, CW, 78, 34, SOFT); rrect(card, X0, Y0 + 44, CW, 34, 0, SOFT);
  el('circle', { cx: X0 + 46, cy: Y0 + 39, r: 18, fill: SLATE }, card);
  txt(card, X0 + 46, Y0 + 46, 'AI', { size: 18, weight: 900, fill: WHITE, anchor: 'middle' });
  txt(card, X0 + 78, Y0 + 50, 'AI 助手', { size: 32, weight: 800 });
  // 输入框
  rrect(card, X0 + 26, Y0 + CH - 96, CW - 52, 70, 35, SOFT, { stroke: PALE, 'stroke-width': 3 });
  const inp = txt(card, X0 + 58, Y0 + CH - 49, '', { size: 32, weight: 600 });
  const caret = rrect(card, 0, Y0 + CH - 80, 4, 38, 2, ACC);
  const sendB = el('circle', { cx: X0 + CW - 66, cy: Y0 + CH - 61, r: 26, fill: ACC }, card);
  const sendA = el('path', { d: `M${X0 + CW - 76},${Y0 + CH - 61} H${X0 + CW - 56} M${X0 + CW - 64},${Y0 + CH - 70} L${X0 + CW - 55},${Y0 + CH - 61} L${X0 + CW - 64},${Y0 + CH - 52}`, stroke: WHITE, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, card);
  const Q = '小团子的生日是哪天？';
  on(t => {
    op(card, P(t, ev.box_in, ev.box_in + .3));
    const n = t < ev.send ? Math.floor(P(t, ev.type[0], ev.type[1]) * Q.length + 1e-6) : 0;
    inp.textContent = Q.slice(0, n);
    caret.setAttribute('x', (X0 + 60 + n * 32).toFixed(1));
    op(caret, t < ev.send && Math.floor(t * 2.6) % 2 === 0 ? 1 : 0);
    const pr = Math.exp(-(((t - ev.send) / .07) ** 2));
    const s = (1 - .15 * pr).toFixed(3), c = `${X0 + CW - 66},${Y0 + CH - 61}`;
    sendB.setAttribute('transform', `translate(${c}) scale(${s}) translate(${-(X0 + CW - 66)},${-(Y0 + CH - 61)})`);
    sendA.setAttribute('transform', sendB.getAttribute('transform'));
  });
  // 提问气泡
  const qb = bubble(card, X0 + CW - 30, Y0 + 140, Q, { fill: ACC_L, align: 'right', size: 34 });
  appear(qb.g, ev.send, { dy: 30 });
  // 三次回答：每次先闪加载点点，再出答案；换下来的变灰
  const AY = [Y0 + 268, Y0 + 404, Y0 + 540];
  const starts = [ev.send + .25, ev.regen1 + .15, ev.regen2 + .15], shows = [ev.a1 - .15, ev.a2 - .15, ev.a3 - .15];
  const outs = [ev.regen1, ev.regen2, 1e9];
  const bubs = [];
  ANS.forEach((d, i) => {
    const g = el('g', { opacity: 0 }, card);
    el('circle', { cx: X0 + 52, cy: AY[i], r: 24, fill: SLATE }, g);
    txt(g, X0 + 52, AY[i] + 7, 'AI', { size: 19, weight: 900, fill: WHITE, anchor: 'middle' });
    const load = el('g', {}, g);
    rrect(load, X0 + 90, AY[i] - 36, 130, 72, 28, SOFT);
    const dots = [0, 1, 2].map(k => el('circle', { cx: X0 + 128 + k * 27, cy: AY[i], r: 8, fill: GREY }, load));
    const ans = el('g', {}, g);
    const b = bubble(ans, X0 + 90, AY[i], '', { size: 34, fill: SOFT });
    b.t.textContent = '';
    const t1 = txt(ans, 0, 0, '小团子的生日是 ', { size: 34, weight: 700 }), t2 = txt(ans, 0, 0, d, { size: 34, weight: 900, fill: BLUE }), t3 = txt(ans, 0, 0, '。', { size: 34, weight: 700 });
    const w1 = t1.getComputedTextLength(), w2 = t2.getComputedTextLength(), w3 = t3.getComputedTextLength();
    const bw = w1 + w2 + w3 + 46;
    b.g.querySelector('rect').setAttribute('width', bw);
    [[t1, 0], [t2, w1], [t3, w1 + w2]].forEach(([e, dx]) => { e.setAttribute('x', X0 + 113 + dx); e.setAttribute('y', AY[i] + 12); });
    bubs.push({ g: ans, x: X0 + 90, y: AY[i], w: bw });
    on(t => {
      op(g, P(t, starts[i], starts[i] + .2) * (t >= outs[i] ? lerp(1, .42, P(t, outs[i], outs[i] + .3)) : 1));
      const sh = P(t, shows[i], shows[i] + .12);
      op(load, 1 - sh); op(ans, sh);
      dots.forEach((c, k) => c.setAttribute('cy', (AY[i] - 9 * Math.abs(Math.sin((t - starts[i]) * 7 - k * .7))).toFixed(1)));
      // 结尾"特别肯定"：三个回答一起跳一下
      const pulse = Math.exp(-(((t - ev.e_sure - .2 - i * .12) / .14) ** 2));
      const s = 1 + .06 * pulse, cx = X0 + 90, cy = AY[i];
      ans.setAttribute('transform', `translate(${cx},${cy}) scale(${s.toFixed(4)}) translate(${-cx},${-cy})`);
    });
  });
  // 回答气泡下面的「重新生成」按钮，跟着最新的回答走
  const rg = el('g', { opacity: 0 }, card);
  const rgIn = el('g', {}, rg);
  rrect(rgIn, -10, -24, 196, 48, 24, WHITE, { stroke: PALE, 'stroke-width': 3 });
  el('path', { d: 'M22,-9 A12,12 0 1 0 26,6', stroke: MID, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, rgIn);
  el('path', { d: 'M17,-15 L23,-9 L15,-5', stroke: MID, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, rgIn);
  txt(rgIn, 44, 9, '重新生成', { size: 26, weight: 700, fill: MID });
  const ring = rrect(rgIn, -10, -24, 196, 48, 24, 'none', { stroke: ACC, 'stroke-width': 5, opacity: 0 });
  on(t => {
    const i = t < ev.regen1 + .2 ? 0 : t < ev.regen2 + .2 ? 1 : 2;
    const vis = P(t, ev.a1 + .2, ev.a1 + .45) * (1 - P(t, ev.a3 + .7, ev.a3 + 1.0));
    op(rg, vis);
    const by = AY[i] + 74;
    const pr = Math.max(Math.exp(-(((t - ev.regen1) / .08) ** 2)), Math.exp(-(((t - ev.regen2) / .08) ** 2)));
    tr(rg, X0 + 92, by, 1 - .1 * pr);
    op(ring, pr);
  });
  // 语气标签：只出一次
  const tone = el('g', { opacity: 0 }, card);
  rrect(tone, X0 + 92, AY[2] + 52, 236, 56, 28, WHITE, { stroke: ACC, 'stroke-width': 4 });
  txt(tone, X0 + 210, AY[2] + 91, '语气：肯定', { size: 30, weight: 800, fill: ACC, anchor: 'middle' });
  appear(tone, ev.tone, { dy: 16 });
  stampAt('都不对', hx + 330, hy - 90, ev.wrong, { w: 300, size: 64, out: ev.title1 - .35 });
  mascot(C.stickers.shock, hx + 330, hy + 250, 290, ev.wrong + .05, { out: ev.fly1[0], rot: 10 });
}

// ===== 片名 =====
function buildTitle() {
  const ev = EV, TX = HOOK[0] - 30, Y = HOOK[1];
  const t1 = txt(W, TX, Y - 50, 'AI 为什么会', { size: 110, weight: 900, ls: 4 });
  const t2 = txt(W, TX, Y + 82, '一本正经地胡说八道', { size: 90, weight: 900, ls: 1 });
  const hl = el('path', { d: '', stroke: ACC, 'stroke-opacity': .28, 'stroke-width': 30, 'stroke-linecap': 'round' }, W);
  W.insertBefore(hl, t2);
  const sub = txt(W, TX + 4, Y + 176, '它只管接得顺，不管说得对', { size: 40, weight: 700, fill: MID, ls: 2 });
  [t1, t2].forEach((e, i) => on(t => {
    const t0 = i ? ev.title2 : ev.title1, p = P(t, t0, t0 + .32), cy = i ? Y + 50 : Y - 80;

      const x = gx + (i % 5) * (CS + CG), y = RY[i / 5 | 0];

  const tags = [1, 2, 3, 4, 5, 6].map(i => ev[`ch${i}_tag`]);
  on(t => {
    op(g, P(t, ev.ch1_tag - .1, ev.ch1_tag + .3) * (1 - P(t, ev.pull[0], ev.pull[0] + .4)));
    let cur = 0;
    tags.forEach((tt, i) => { if (t >= tt - .3) cur = i; });
    dots.forEach((c, i) => c.setAttribute('fill', i < cur ? SLATE : i === cur ? ACC : PALE));
    name.textContent = TAG_TITLES[cur];
  });
}

// ---------- 镜头 ----------
let KEYS;
function camKeys() {
  const ev = EV;
  const k = (t, p, z, fly = false, dx = 0, dy = 0) => ({ t, x: p[0] + dx, y: p[1] + dy, z, fly });
  return [
    k(0, HC, 1.12), k(ev.hook_pan[0], HC, 1.15, false, 4, 2),
    k(ev.hook_pan[1], HOOK, 1.0, true), k(ev.fly1[0], HOOK, 1.03, false, 6, 3),
    k(ev.fly1[1], C1, 1.0, true), k(ev.fly2[0], C1, 1.03, false, 6, 4),
    k(ev.fly2[1], C2, 1.0, true), k(ev.fly3[0], C2, 1.03, false, 6, 4),
    k(ev.fly3[1], C3, 1.0, true), k(ev.fly4[0], C3, 1.03, false, -6, 4),
    k(ev.fly4[1], C4, 1.0, true), k(ev.fly5[0], C4, 1.03, false, -6, 4),
    k(ev.fly5[1], C5, 1.0, true), k(ev.fly_cl[0], C5, 1.03, false, 0, 6),
    k(ev.fly_cl[1], CL, 1.0, true), k(ev.push - .1, CL, 1.03),
    k(ev.push + .9, PUSH, 1.5, true), k(ev.fly6[0], PUSH, 1.55),
    k(ev.fly6[1], C6, 1.0, true), k(ev.pull[0], C6, 1.03, false, 6, 0),
    k(ev.pull[1], C7, 1.0, true), k(ev.fly_end[0], C7, 1.03),
    k(ev.fly_end[1], HOOK, 1.0, true), k(C.duration, HOOK, 1.04),
  ];
}
function camAt(t) {
  let i = 0;
  while (i < KEYS.length - 2 && t >= KEYS[i + 1].t) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const p = P(t, a.t, b.t);
  if (!b.fly) return { x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), z: lerp(a.z, b.z, p) };
  const e = ease.inOutQuint(p);
  const lz = Math.exp(lerp(Math.log(a.z), Math.log(b.z), ease.inOutCubic(p)));
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  const dip = Math.min(.22, dist / 12000) * Math.sin(Math.PI * p);
  return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), z: lz * (1 - dip) };
}

// ---------- 入口 ----------
window.DEMO = { width: 1920, height: 1080, fps: 30, duration: 60 };
// 渲染器问：这一帧要不要运动模糊？只有镜头在飞（前后各多 2 帧）或奖杯砸下镜头抖动时才要，其余帧只截一张
window.blurAt = (t) => {
  if (!KEYS) return true;
  const pad = 2 / 30;
  for (let i = 1; i < KEYS.length; i++) if (KEYS[i].fly && t > KEYS[i - 1].t - pad && t < KEYS[i].t + pad) return true;
  return t > EV.land - pad && t < EV.land + .5;
};
window.renderAt = async (t) => {
  const cam = camAt(t);
  // 奖杯砸下时镜头抖一下
  const sh = EV && t >= EV.land ? Math.exp(-(t - EV.land) * 9) : 0;
  const jx = sh * 10 * Math.sin(t * 90), jy = sh * 8 * Math.cos(t * 77);
  CAM.setAttribute('transform', `translate(${(960 + jx).toFixed(2)},${(540 + jy).toFixed(2)}) scale(${cam.z.toFixed(5)}) translate(${(-cam.x).toFixed(2)},${(-cam.y).toFixed(2)})`);
  for (const f of U) f(t, cam);
};
(async () => {
  C = await (await fetch('cues.json')).json();
  EV = C.ev;
  window.DEMO.duration = C.duration;
  await document.fonts.load('800 40px NS', 'AI为什么会一本正经地胡说八道练的是接话见得少就靠猜口气很肯定考试不会也写满打分奖励蒙怎么防'); await document.fonts.load('600 30px JB', '0123456789/+.'); await document.fonts.load('800 40px IN', 'AI');
  await document.fonts.ready;
  await Promise.all(Object.values(C.stickers).concat([C.brand.mascot.split('/').pop()]).map(f => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = `/assets/xiaotuanzi/${f}`; })));
  KEYS = camKeys();
  build();
  const q = new URLSearchParams(location.search);
  await window.renderAt(+(q.get('t') || 0));
  window.__ready = true;
})();
